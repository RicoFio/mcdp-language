name: Publish VSCode Extension

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode-mcdpl/package-lock.json

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install VSCode extension dependencies
        working-directory: editors/vscode-mcdpl
        run: npm ci

      - name: Check VSCode extension
        working-directory: editors/vscode-mcdpl
        run: npm run check

      - name: Preflight VSCode extension metadata
        working-directory: editors/vscode-mcdpl
        run: npm run preflight

  publish-vscode:
    name: Publish VSCode extension (${{ matrix.vsce_target }})
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            vsce_target: linux-x64
            platform_dir: linux-x64
            server_binary: mcdp-lsp
            vsix_name: mcdpl-vscode-linux-x64.vsix
          - os: macos-15-intel
            vsce_target: darwin-x64
            platform_dir: darwin-x64
            server_binary: mcdp-lsp
            vsix_name: mcdpl-vscode-darwin-x64.vsix
          - os: macos-15
            vsce_target: darwin-arm64
            platform_dir: darwin-arm64
            server_binary: mcdp-lsp
            vsix_name: mcdpl-vscode-darwin-arm64.vsix
          - os: windows-latest
            vsce_target: win32-x64
            platform_dir: win32-x64
            server_binary: mcdp-lsp.exe
            vsix_name: mcdpl-vscode-win32-x64.vsix

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode-mcdpl/package-lock.json

      - name: Build release language server
        run: cargo build --release -p mcdp-lsp

      - name: Install VSCode extension dependencies
        working-directory: editors/vscode-mcdpl
        run: npm ci

      - name: Sync VSCode extension version
        working-directory: editors/vscode-mcdpl
        run: npm run sync-version

      - name: Copy license into VSCode package
        shell: bash
        run: cp LICENSE editors/vscode-mcdpl/LICENSE

      - name: Bundle language server
        shell: bash
        run: |
          server_dir="editors/vscode-mcdpl/server/${{ matrix.platform_dir }}"
          mkdir -p "$server_dir"
          cp "target/release/${{ matrix.server_binary }}" "$server_dir/${{ matrix.server_binary }}"
          chmod +x "$server_dir/${{ matrix.server_binary }}"

      - name: Preflight VSCode package
        working-directory: editors/vscode-mcdpl
        env:
          MCDPL_REQUIRE_PACKAGED_LICENSE: "1"
          MCDPL_SERVER_TARGET: ${{ matrix.platform_dir }}
        run: npm run preflight

      - name: Package VSCode extension
        working-directory: editors/vscode-mcdpl
        run: npx --yes @vscode/vsce package --readme-path MARKETPLACE.md --target "${{ matrix.vsce_target }}" --out "${{ matrix.vsix_name }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcdpl-vscode-${{ matrix.vsce_target }}
          path: editors/vscode-mcdpl/${{ matrix.vsix_name }}

      - name: Publish VSCode extension
        working-directory: editors/vscode-mcdpl
        env:
          VSCE_PAT: ${{ secrets.AZURE_PERSONAL_ACCESS_TOKEN }}
        run: npx --yes @vscode/vsce publish --packagePath "${{ matrix.vsix_name }}"
