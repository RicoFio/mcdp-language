name: Publish VSCode Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVER_DIR: editors/vscode-mcdpl/server/linux-x64
  VSCE_TARGET: linux-x64
  VSIX_NAME: mcdpl-vscode-linux-x64.vsix

jobs:
  publish-vscode:
    name: Build and publish VSCode extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode-mcdpl/package-lock.json

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release language server
        run: cargo build --release -p mcdp-lsp

      - name: Install VSCode extension dependencies
        working-directory: editors/vscode-mcdpl
        run: npm ci

      - name: Check VSCode extension
        working-directory: editors/vscode-mcdpl
        run: npm run check

      - name: Bundle Linux language server
        run: |
          mkdir -p "$SERVER_DIR"
          cp target/release/mcdp-lsp "$SERVER_DIR/mcdp-lsp"
          chmod +x "$SERVER_DIR/mcdp-lsp"

      - name: Set CI extension version
        working-directory: editors/vscode-mcdpl
        run: npm version --no-git-tag-version "0.1.${GITHUB_RUN_NUMBER}"

      - name: Package VSCode extension
        working-directory: editors/vscode-mcdpl
        run: npx --yes @vscode/vsce package --target "$VSCE_TARGET" --out "$VSIX_NAME"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcdpl-vscode
          path: editors/vscode-mcdpl/mcdpl-vscode-linux-x64.vsix

      - name: Publish VSCode extension
        working-directory: editors/vscode-mcdpl
        env:
          AZURE_PERSONAL_ACCESS_TOKEN: ${{ secrets.AZURE_PERSONAL_ACCESS_TOKEN }}
        run: npx --yes @vscode/vsce publish --packagePath "$VSIX_NAME" -p "$AZURE_PERSONAL_ACCESS_TOKEN"
